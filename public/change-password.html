<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100f">
  <title>修改密码 · 红黑记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: linear-gradient(135deg, #0a0d12 0%, #161d2b 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #0f131c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .login-header h1 {
      font-size: clamp(1.5rem, 4vw, 1.875rem);
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.5rem 0;
    }
    .login-header p {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
      margin: 0;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .form-group label {
      font-size: 0.875rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
    }
    .form-group input {
      padding: 0.875rem 1rem;
      background: #1e2636;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
      background: #161d2b;
    }
    .form-group small {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.813rem;
    }
    .login-button {
      padding: 1rem;
      background: linear-gradient(135deg, #38bdf8 0%, #3b6dff 100%);
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .login-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
    }
    .login-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error-message, .success-message {
      padding: 0.875rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .error-message.show, .success-message.show {
      display: block;
    }
    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }
    .back-link a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s;
    }
    .back-link a:hover {
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>修改密码</h1>
        <p>为了账户安全，请定期更换密码</p>
      </div>
      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>
      <form class="login-form" id="changePasswordForm">
        <div class="form-group">
          <label for="oldPassword">当前密码</label>
          <input type="password" id="oldPassword" name="oldPassword" required autocomplete="current-password" autofocus>
        </div>
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" minlength="6">
          <small>密码长度至少6位</small>
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" class="login-button" id="changeButton">修改密码</button>
      </form>
      <div class="back-link">
        <a href="/">← 返回首页</a>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const form = document.getElementById('changePasswordForm');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const changeButton = document.getElementById('changeButton');
      const oldPasswordInput = document.getElementById('oldPassword');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const oldPassword = oldPasswordInput.value;
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword !== confirmPassword) {
          showError('两次输入的新密码不一致');
          return;
        }

        if (newPassword.length < 6) {
          showError('新密码长度至少为6位');
          return;
        }

        changeButton.disabled = true;
        changeButton.textContent = '修改中...';
        hideMessages();

        try {
          const response = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ oldPassword, newPassword })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || '修改失败');
          }

          showSuccess('密码修改成功！3秒后跳转到登录页面...');
          form.reset();

          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        } catch (error) {
          showError(error.message);
          changeButton.disabled = false;
          changeButton.textContent = '修改密码';
        }
      });

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
        successMessage.classList.remove('show');
      }

      function showSuccess(message) {
        successMessage.textContent = message;
        successMessage.classList.add('show');
        errorMessage.classList.remove('show');
      }

      function hideMessages() {
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');
      }
    })();
  </script>
</body>
</html>
