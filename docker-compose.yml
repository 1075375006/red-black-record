name: redblack

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: red-black-record-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: redblack
      POSTGRES_USER: redblack
      POSTGRES_PASSWORD: redblack_local_password
    volumes:
      - red_black_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redblack -d redblack"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: red-black-record-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4399
      DATABASE_URL: postgres://redblack:redblack_local_password@db:5432/redblack
    ports:
      - "${WEB_PORT:-4399}:4399"

volumes:
  red_black_pgdata:
