<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代理管理 - 红黑记录</title><link rel="stylesheet" href="/proxy-admin/admin.css"></head>
<body><main class="wrap">
  <header><div><a href="/">红黑记录</a><h1>上游代理管理</h1><p>代理仅用于服务端访问体彩比赛和赛果 API。</p></div><button id="reload">刷新状态</button></header>
  <section class="card"><div class="row"><div><h2>全局设置</h2><p id="summary">正在读取配置…</p></div><label class="switch"><input id="enabled" type="checkbox"><span>启用代理</span></label></div><div class="row"><label class="switch"><input id="fallback" type="checkbox"><span>全部代理失败后直连兜底</span></label><button id="save-settings" class="primary">保存设置</button></div><p id="encryption-warning" class="warning hidden">未检测到密码加密密钥。请在部署环境配置 PROXY_SECRET_KEY，再添加带认证信息的代理。</p></section>
  <section class="card"><div class="row"><h2>代理列表</h2><button id="add" class="primary">添加代理</button></div><div class="table-scroll"><table><thead><tr><th>顺序</th><th>名称</th><th>协议</th><th>代理地址</th><th>认证</th><th>状态</th><th>延迟</th><th>启用</th><th>操作</th></tr></thead><tbody id="proxies"></tbody></table></div><p class="muted">可用 ↑ ↓ 调整优先级，优先使用列表靠前的代理。</p></section>
  <details class="card"><summary>高级设置</summary><div class="grid"><label>单次超时（毫秒）<input id="timeoutMs" type="number" min="1000"></label><label>总超时（毫秒）<input id="totalTimeoutMs" type="number" min="1000"></label><label>失败阈值<input id="failureThreshold" type="number" min="1"></label><label>冷却时长（毫秒）<input id="cooldownMs" type="number" min="1000"></label><label>健康检查间隔（毫秒）<input id="healthCheckIntervalMs" type="number" min="1000"></label><label>允许访问的域名（每行一个）<textarea id="allowedHosts" readonly></textarea></label></div></details>
  <details class="card"><summary>最近请求日志</summary><div id="logs" class="logs"></div></details><details class="card"><summary>配置变更记录</summary><div id="audit" class="logs"></div></details>
</main>
<dialog id="editor"><form method="dialog" id="proxy-form"><h2 id="form-title">添加代理</h2><label>粘贴代理地址（可选）<div class="inline"><input id="proxy-url" placeholder="socks5h://用户名:密码@地址:端口"><button type="button" id="parse-url">解析</button></div></label><div class="grid"><label>名称<input name="name" required maxlength="30"></label><label>协议<select name="protocol"><option value="socks5h">socks5h（推荐）</option><option value="socks5">socks5</option></select></label><label>地址<input name="host" required></label><label>端口<input name="port" type="number" min="1" max="65535" required></label><label>用户名<input name="username" autocomplete="off"></label><label>密码<input name="password" type="password" autocomplete="new-password"></label><label class="wide">备注<input name="remark" maxlength="100"></label><label class="switch"><input name="enabled" type="checkbox" checked><span>启用此代理</span></label></div><p id="password-hint" class="muted"></p><div class="actions"><button type="button" id="test-form">测试连接</button><button type="button" id="cancel">取消</button><button type="button" id="save-proxy" class="primary">保存</button></div><pre id="test-output"></pre></form></dialog><script src="/proxy-admin/admin.js"></script></body></html>
